# Production Application Configuration for Google Cloud Run (Supabase PostgreSQL)
spring.application.name=CodeReviewer
server.port=${PORT:8080}

# Supabase Session Pooler (Port 5432 for JPA / Hibernate prepared statements)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Disable Kafka and Redis for serverless Cloud Run
spring.kafka.listener.auto-startup=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# GitHub Direct OAuth Configuration
github.oauth.client-id=${GITHUB_OAUTH_CLIENT_ID:}
github.oauth.client-secret=${GITHUB_OAUTH_CLIENT_SECRET:}
github.oauth.redirect-uri=${GITHUB_OAUTH_REDIRECT_URI:https://pcr-frontend-u36rneughq-el.a.run.app/repositories}

# Groq AI
groq.api.key=${GROQ_API_KEY:mock-key}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=openai/gpt-oss-120b
groq.fallback-model=llama-3.1-8b-instant
groq.safe-tpm-limit=50000

# JWT Secret (Mandatory in production)
app.jwt.secret=${APP_JWT_SECRET:C3XhEpJMGFodmMirn0D29Ijp3xvZpobwip6hZQ69qSY=}

# CORS Allowed Origins
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

# Spring Mail (Optional / Injected via env)
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}


