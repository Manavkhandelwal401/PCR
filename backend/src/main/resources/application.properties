spring.application.name=CodeReviewer
server.port=${PORT:8080}
spring.config.import=optional:file:./github-oauth.properties,optional:file:./local.properties

#Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.pwfmafhtlvbrogfjcocs.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:\#u2yU4MBNazVfB!}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

#Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Apache Kafka Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=code-reviewer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# AI / Groq API Configuration (Supply via GROQ_API_KEY environment variable or local config)
groq.api.key=${GROQ_API_KEY:gsk_mock_api_key_for_testing}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=openai/gpt-oss-120b
groq.fallback-model=llama-3.1-8b-instant
groq.tpm.limit=10000
groq.safe-tpm-limit=10000
groq.rpm.limit=30
groq.max-chunk-tokens=1800
groq.max-response-tokens=600

github.app.id=${GITHUB_APP_ID:4816887}
github.app.private-key-path=${GITHUB_APP_PRIVATE_KEY_PATH:src/main/resources/pkcs8-github-key.pem}

# GitHub Direct OAuth Configuration
# Supply github.oauth.client-id and github.oauth.client-secret through
# environment variables in deployment, or backend/github-oauth.properties locally.
github.oauth.client-id=${GITHUB_OAUTH_CLIENT_ID:${github.oauth.client-id:}}
github.oauth.client-secret=${GITHUB_OAUTH_CLIENT_SECRET:${github.oauth.client-secret:}}
github.oauth.redirect-uri=${GITHUB_OAUTH_REDIRECT_URI:http://localhost:5173/repositories}

# GitHub Webhook HMAC Secret (optional in local dev, enforced in production)
github.webhook.secret=${GITHUB_WEBHOOK_SECRET:}

# Logging Levels (Production optimized: disabled SQL & trace verbosity)
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# CORS Allowed Origins (Comma-separated exact origins)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT Security Configuration (Reads from environment APP_JWT_SECRET, mandatory >= 32 chars)
app.jwt.secret=${APP_JWT_SECRET:C3XhEpJMGFodmMirn0D29Ijp3xvZpobwip6hZQ69qSY=}

# Multipart Upload Limits (Max file size 5MB, Max request total 15MB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# Spring Mail (Gmail SMTP) Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:manavkhandelwal06@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
